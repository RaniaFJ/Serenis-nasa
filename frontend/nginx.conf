server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # DNS interne de Docker : permet de démarrer même si le service "backend" n'existe pas (mode mock)
  resolver 127.0.0.11 valid=10s;

  # En-têtes de sécurité (défense en profondeur côté navigateur)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

  # Le navigateur appelle /api/... → nginx retire /api et relaie vers le conteneur FastAPI.
  # Le navigateur ne voit jamais le backend ni la base de données directement.
  location /api/ {
    set $upstream http://backend:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  # Application React (routage côté client)
  location / {
    try_files $uri /index.html;
  }
}
